openapi: 3.0.3
info:
  title: API WASAText
  description: |-
    Specifica API per la piattaforma di messaggistica WASAText.
    Gestisce chat individuali e di gruppo, invio messaggi, inoltri e commenti.
    Progetto WASA 2026.
  version: "1.0.0"

# ===============================================
# SEZIONE 1: ANALISI E SCHEMI (components)
# ===============================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "L'identificatore utente restituito dall'endpoint /session"

  schemas:
    # ---------------- SCHEMI ATOMICI RIUTILIZZABILI ----------------
    Identifier:
      type: string
      description: "Identificatore univoco generato dal server (token)."
      example: "abcdef012345"

    ConversazioneIdSchema:
      type: string
      description: "ID univoco della conversazione."
      example: "conv-98765"

    MessaggioIdSchema:
      type: string
      description: "ID univoco del messaggio."
      example: "msg-12345"

    CommentoIdSchema:
      type: string
      description: "ID univoco del commento/reazione."
      example: "cmt-54321"

    Username:
      type: string
      description: "Nome utente valido nel sistema."
      pattern: '^.*?$'
      minLength: 3
      maxLength: 16
      example: "Maria"

    Photo:
      type: string
      description: "Immagine codificata (es. Base64 o URL risorsa)."
      example: "data:image/png;base64,iVBORw0KGgo..."

    MessageContent:
      type: string
      description: "Contenuto testuale di un messaggio o di un commento."
      minLength: 1

    # ---------------- ENTITÀ PRINCIPALI ----------------
    Utente:
      title: Dettagli Utente
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Username'
        photo:
          $ref: '#/components/schemas/Photo'
      required:
        - name

    Commento:
      title: Reazione/Commento
      type: object
      properties:
        id:
          $ref: '#/components/schemas/CommentoIdSchema'
        author:
          $ref: '#/components/schemas/Username'
        content:
          $ref: '#/components/schemas/MessageContent'
      required:
        - id
        - author
        - content

    Messaggio:
      title: Messaggio di Chat
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MessaggioIdSchema'
        timestamp:
          type: string
          format: date-time
        sender:
          $ref: '#/components/schemas/Username'
        content:
          $ref: '#/components/schemas/MessageContent'
        type:
          type: string
          enum: [text, photo]
        checkmarks:
          type: integer
          enum: [0, 1, 2]
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/Commento'
      required:
        - id
        - timestamp
        - sender
        - content
        - type
        - checkmarks

    Conversazione:
      title: Dettagli Conversazione
      description: "Rappresenta una chat singola o di gruppo"
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ConversazioneIdSchema'
        name:
          $ref: '#/components/schemas/Username'
        photo:
          $ref: '#/components/schemas/Photo'
        lastMessage:
          $ref: '#/components/schemas/MessageContent'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Messaggio'
      required:
        - id

    StandardError:
      title: Errore Standard
      type: object
      properties:
        error:
          type: string
          description: "Descrizione dettagliata dell'errore ad uso del frontend."
      required:
        - error

  # ---------------- PARAMETRI DI PATH RIUTILIZZABILI ----------------
  parameters:
    ConversazioneID:
      name: conversazioneID
      in: path
      description: "Identificatore univoco della risorsa conversazione"
      required: true
      schema:
        $ref: '#/components/schemas/ConversazioneIdSchema'

    MessaggioID:
      name: messaggioID
      in: path
      description: "Identificatore univoco della risorsa messaggio"
      required: true
      schema:
        $ref: '#/components/schemas/MessaggioIdSchema'

    CommentoID:
      name: commentoID
      in: path
      description: "Identificatore univoco della risorsa commento"
      required: true
      schema:
        $ref: '#/components/schemas/CommentoIdSchema'

  # ---------------- RISPOSTE GLOBALI (DRY) ----------------
  responses:
    204_NoContent:
      description: "Operazione completata con successo. Nessun contenuto restituito."

    400_BadRequest:
      description: "Richiesta malformata, dati mancanti o non validi."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
          examples:
            InvalidData:
              value:
                error: "Dati in ingresso non validi rispetto allo schema."

    401_Unauthorized:
      description: "Non autorizzato. Token mancante o non valido."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
          examples:
            MissingToken:
              value:
                error: "Header Authorization mancante o token invalido."

    403_Forbidden:
      description: "Permessi insufficienti per compiere l'azione."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
          examples:
            NotAllowed:
              value:
                error: "Non hai i permessi per modificare questa risorsa."

    404_NotFound:
      description: "Risorsa non trovata."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
          examples:
            NotFound:
              value:
                error: "La risorsa richiesta non esiste."

    409_Conflict:
      description: "Conflitto di stato."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
          examples:
            Duplicate:
              value:
                error: "L'elemento esiste già o crea un conflitto (es. username in uso)."

# ===============================================
# SEZIONE 2: DEFINIZIONE DEI PATH
# ===============================================
paths:

  # ---------------- AUTENTICAZIONE E SESSIONE ----------------
  /session:
    post:
      tags: ["login"]
      summary: "Logs in the user"
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: "User details"
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
              required:
                - name
      responses:
        '201':
          description: "User log-in action successful"
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "abcdef012345"
        '400':
          $ref: '#/components/responses/400_BadRequest'

  # ---------------- GESTIONE UTENTE LOGGATO ----------------
  /utenti/me/username:
    patch:
      tags: ["user"]
      summary: "Cambia l'username dell'utente"
      operationId: setMyUserName
      security: 
        - bearerAuth: []
      requestBody:
        description: "Il nuovo username desiderato"
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:  
                  $ref: '#/components/schemas/Username'
              required:
                - name
      responses:
        '204':
          $ref: '#/components/responses/204_NoContent'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '409':
          $ref: '#/components/responses/409_Conflict'

  /utenti/me/photo:
    patch:
      tags: ["user"]
      summary: "Cambia la foto dell'utente"
      operationId: setMyPhoto
      security: 
        - bearerAuth: []
      requestBody:
        description: "Immagine codificata"
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photo:  
                  $ref: '#/components/schemas/Photo'
              required:
                - photo
      responses:
        '204':
          $ref: '#/components/responses/204_NoContent'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'

  # ---------------- CONVERSAZIONI E GRUPPI ----------------
  /conversazioni:
    get:
      tags: ["conversazioni"]
      summary: "Lista tutte le conversazioni"
      operationId: getMyConversations
      security: 
        - bearerAuth: []
      responses:
        '200':
          description: "Array di conversazioni (metadati e snippet ultimo messaggio)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversazione'
        '401':
          $ref: '#/components/responses/401_Unauthorized'

  /conversazioni/{conversazioneID}:
    parameters:
      - $ref: '#/components/parameters/ConversazioneID'
    get:
      tags: ["conversazioni"]
      summary: "Ottieni una conversazione specifica"
      operationId: getConversation
      security: 
        - bearerAuth: []
      responses:
        '200':
          description: "Dettagli della conversazione con messaggi."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversazione'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'

  /conversazioni/{conversazioneID}/name:
    parameters:
      - $ref: '#/components/parameters/ConversazioneID'
    patch:
      tags: ["gruppi"]
      summary: "Modifica il nome del gruppo"
      operationId: setGroupName
      security: 
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:  
                  $ref: '#/components/schemas/Username'
              required:
                - name
      responses:
        '204':
          $ref: '#/components/responses/204_NoContent'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'

  /conversazioni/{conversazioneID}/photo:
    parameters:
      - $ref: '#/components/parameters/ConversazioneID'
    patch:
      tags: ["gruppi"]
      summary: "Modifica la foto del gruppo"
      operationId: setGroupPhoto
      security: 
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photo:  
                  $ref: '#/components/schemas/Photo'
              required:
                - photo
      responses:
        '204':
          $ref: '#/components/responses/204_NoContent'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'

  /conversazioni/{conversazioneID}/partecipanti:
    parameters:
      - $ref: '#/components/parameters/ConversazioneID'
    post:
      tags: ["gruppi"]
      summary: "Aggiungi un nuovo utente al gruppo"
      operationId: addToGroup
      security: 
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  $ref: '#/components/schemas/Username'
              required:
                - userId
      responses:
        '204':
          $ref: '#/components/responses/204_NoContent'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '409':
          $ref: '#/components/responses/409_Conflict'

  /conversazioni/{conversazioneID}/partecipanti/me:
    parameters:
      - $ref: '#/components/parameters/ConversazioneID'
    delete: 
      tags: ["gruppi"]
      summary: "Rimuovi te stesso dal gruppo"
      operationId: leaveGroup
      security: 
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/204_NoContent'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '404':
          $ref: '#/components/responses/404_NotFound'

  # ---------------- MESSAGGI E COMMENTI ----------------
  /conversazioni/{conversazioneID}/messaggi:
    parameters:
      - $ref: '#/components/parameters/ConversazioneID'
    post: 
      tags: ["messaggi"]
      summary: "Invia un messaggio"
      operationId: sendMessage
      security: 
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:  
                  $ref: '#/components/schemas/MessageContent'
                type:
                  $ref: '#/components/schemas/Messaggio/properties/type'
                replyToMessageId:
                  $ref: '#/components/schemas/MessaggioIdSchema'
              required:
                - content
                - type
      responses:
        '201':
          description: "Messaggio inviato con successo."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Messaggio'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '404':
          $ref: '#/components/responses/404_NotFound'

  /conversazioni/{conversazioneID}/messaggi/forward:
    parameters:
      - $ref: '#/components/parameters/ConversazioneID'
    post:
      tags: ["messaggi"]
      summary: "Inoltra un messaggio"
      operationId: forwardMessage
      security: 
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                forwardedMessageId:
                  $ref: '#/components/schemas/MessaggioIdSchema'
              required:
                - forwardedMessageId
      responses:
        '201':
          description: "Messaggio inoltrato con successo."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Messaggio'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '404':
          $ref: '#/components/responses/404_NotFound'

  /conversazioni/{conversazioneID}/messaggi/{messaggioID}:
    parameters:
      - $ref: '#/components/parameters/ConversazioneID'
      - $ref: '#/components/parameters/MessaggioID'
    delete: 
      tags: ["messaggi"]
      summary: "Elimina un messaggio"
      operationId: deleteMessage
      security: 
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/204_NoContent'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'

  /conversazioni/{conversazioneID}/messaggi/{messaggioID}/commenti:
    parameters:
      - $ref: '#/components/parameters/ConversazioneID'
      - $ref: '#/components/parameters/MessaggioID'
    post: 
      tags: ["commenti"]
      summary: "Aggiungi una reazione al messaggio"
      operationId: commentMessage
      security: 
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:  
                  $ref: '#/components/schemas/MessageContent'
              required:
                - content
      responses:
        '201':
          description: "Commento aggiunto."
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '404':
          $ref: '#/components/responses/404_NotFound'

  /conversazioni/{conversazioneID}/messaggi/{messaggioID}/commenti/{commentoID}:
    parameters:
      - $ref: '#/components/parameters/ConversazioneID'
      - $ref: '#/components/parameters/MessaggioID'
      - $ref: '#/components/parameters/CommentoID'
    delete: 
      tags: ["commenti"]
      summary: "Rimuovi una reazione"
      operationId: uncommentMessage
      security: 
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/204_NoContent'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'